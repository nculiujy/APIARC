[theme]
base = "light"
primaryColor = "#1f6feb"
backgroundColor = "#f5f7f9"
secondaryBackgroundColor = "#ffffff"
textColor = "#16202b"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 4096

[browser]
gatherUsageStats = false

[runner]
magicEnabled = false
fastReruns = true

[client]
toolbarMode = "minimal"
showErrorDetails = true
